name: Bug report
description: Report a reproducible WallCab defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not disclose security vulnerabilities here. Use SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the route or wallpaper URL with secrets removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, iOS, or Node version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
