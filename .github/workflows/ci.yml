name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: wallcab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit

      - name: Run static, Worker, unit, integration, and build gates
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npx playwright test

      - name: Run Lighthouse budgets
        run: |
          set +e
          npm run lighthouse
          lighthouse_status=$?
          if [ "$lighthouse_status" -ne 0 ]; then
            node scripts/report-lighthouse-failures.mjs
          fi
          exit "$lighthouse_status"
